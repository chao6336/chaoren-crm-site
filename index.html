<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#00694a">
  <link rel="icon" href="assets/sw-ii-icon.png">
  <title>SW-II 活動報名</title>
  <meta name="description" content="晁人文鼎協會活動報名">
  <script>
    // 學員前台只有報名、我的活動、報到。工作人員舊書籤與邀請／重設密碼連結，在載入任何程式前就轉到 /admin/，
    // 避免登入憑證先被這一頁讀走。
    (function(){ var r=location.hash.slice(1).split("?")[0];
      if(/[?&]flow=set-password/.test(location.search)||/access_token=|error_description=/.test(location.hash)||/^(dashboard|events|contacts|checkin|sponsors|import|messages|governance|users|login|set-password)$/.test(r))
        location.replace("admin/"+location.search+location.hash); })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20261026-3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body class="signed-out">
  <header class="topbar">
    <a class="brand" href="#register" aria-label="回到活動清單"><img src="assets/sw-ii-logo.png" alt="SW-II" width="124" height="30"><strong>活動報名</strong></a>
    <div class="userbox"><a id="homeBtn" class="button secondary small" href="#register" hidden>回首頁</a><span id="modeBadge" class="badge">展示模式</span><select id="demoUser" hidden aria-label="展示模式：切換檢視身分"></select><span id="userLabel"></span><button id="logoutBtn" class="secondary small" data-action="logout" hidden>登出</button></div>
  </header>

  <div class="shell">
    <nav class="sidebar" aria-label="主要功能">
      <a href="#dashboard" data-route="dashboard">總覽</a>
      <a href="#events" data-route="events">活動</a>
      <a href="#contacts" data-route="contacts">會員資料</a>
      <a href="#checkin" data-route="checkin">現場報到</a>
      <a href="#sponsors" data-route="sponsors">贊助紀錄</a>
      <a href="#import" data-route="import">匯入名冊</a>
      <a href="#messages" data-route="messages">LINE 訊息</a>
      <a href="#governance" data-route="governance">資料治理</a>
      <a href="#applications" data-route="applications">待開通</a>
      <a href="#users" data-route="users">使用者</a>
      <a href="#me" data-route="me" data-demo-only hidden>學員頁（展示）</a>
    </nav>
    <main id="app" tabindex="-1"></main>
  </div>

  <dialog id="modal"><button type="button" class="dialog-close" data-action="close-modal" aria-label="關閉">×</button><div id="modalBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=20261026-3"></script>
  <script type="module" src="app.js?v=20261026-3"></script>
</body>
</html>
